
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>Admin Dashboard</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/">
            Recruitment Portal
        </a>
    </div>
</nav>

<div class="container py-5">

    <h2 class="mb-4">Admin Dashboard</h2>

    <div class="row g-4">

        <div class="col-md-3">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h5>Total Jobs</h5>
                    <h2>{{ total_jobs }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h5>Total Applications</h5>
                    <h2>{{ total_applications }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h5>Shortlisted</h5>
                    <h2>{{ shortlisted }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h5>Interviews</h5>
                    <h2>{{ interviews }}</h2>
                </div>
            </div>
        </div>

    </div>

    <div class="mt-4">
        <a href="/admin/" class="btn btn-primary">
            Manage Jobs & Applications
        </a>
    </div>

</div>

</body>
</html>
